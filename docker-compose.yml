version: '3.8'

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      
  clickhouse:
    image: clickhouse/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    env_file:
      - .env
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1

  # --- YENİ EKLENEN KISIM ---
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      # ClickHouse eklentisini açılışta otomatik indir
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      # Şifre sormadan admin girişi (Geliştirme ortamı için)
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - clickhouse
  # --------------------------